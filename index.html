<style>

/* =========================================================
   DESIGN
   You normally DON'T need to change anything below here.
   ========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;

    font-family: Georgia, "Times New Roman", serif;

    display: flex;
    justify-content: center;
    align-items: center;

    color: white;

    overflow-x: hidden;
}


/* =====================================================
   VIDEO BACKGROUND
   ===================================================== */

.video-background {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    z-index: -3;

}


/* =====================================================
   DARK OVERLAY
   ===================================================== */

.video-overlay {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    background: rgba(0,0,0,0.38);

    z-index: -2;

}


/* Main container */

.container {
    width: 92%;
    max-width: 500px;

    text-align: center;

    padding: 35px 15px;
}


/* Header */

.small-title {
    font-size: 13px;

    letter-spacing: 4px;

    text-transform: uppercase;

    margin-bottom: 12px;

    opacity: 0.9;
}

h1 {
    font-size: 43px;

    margin-bottom: 12px;

    text-shadow:
        0 4px 15px rgba(0,0,0,0.6);
}

.subtitle {
    font-size: 16px;

    line-height: 1.6;

    margin-bottom: 30px;
}


/* Card */

.card {

    background: rgba(255,255,255,0.94);

    color: #333;

    border-radius: 28px;

    padding: 30px 24px;

    box-shadow:
        0 20px 50px rgba(0,0,0,0.4);

    backdrop-filter: blur(10px);

}


/* Day number */

.day-number {

    color: #a05a68;

    font-size: 13px;

    letter-spacing: 3px;

    font-weight: bold;

    margin-bottom: 10px;
}


/* Surprise title */

.card h2 {

    font-size: 28px;

    margin-bottom: 15px;

}


/* Description */

.description {

    font-size: 16px;

    line-height: 1.7;

    margin-bottom: 22px;

}


/* Open button */

.open-button {

    border: none;

    background: #a05a68;

    color: white;

    padding: 15px 26px;

    border-radius: 50px;

    font-size: 15px;

    font-family: inherit;

    cursor: pointer;

    transition: 0.25s;

}

.open-button:hover {

    transform: scale(1.05);

}

.open-button:active {

    transform: scale(0.96);

}


/* Surprise content */

.surprise {

    display: none;

    margin-top: 20px;

    animation: appear 0.7s ease;

}

@keyframes appear {

    from {

        opacity: 0;

        transform: translateY(20px);

    }

    to {

        opacity: 1;

        transform: translateY(0);

    }

}


/* Message */

.message {

    font-size: 18px;

    line-height: 1.8;

    margin-bottom: 22px;

    font-style: italic;

}


/* Images */

.photo-gallery {

    display: flex;

    flex-direction: column;

    gap: 15px;

}

.photo-gallery img {

    width: 100%;

    border-radius: 18px;

    display: block;

    box-shadow:
        0 6px 18px rgba(0,0,0,0.2);

}


/* Counter */

.counter {

    margin-top: 18px;

    font-size: 13px;

    opacity: 0.85;

}


/* Floating hearts */

.hearts {

    position: fixed;

    inset: 0;

    pointer-events: none;

    overflow: hidden;

}

.heart {

    position: absolute;

    bottom: -30px;

    animation: floatHeart 10s linear forwards;

    opacity: 0.4;

}

@keyframes floatHeart {

    0% {

        transform:
            translateY(0)
            rotate(0deg);

        opacity: 0;

    }

    15% {

        opacity: 0.7;

    }

    100% {

        transform:
            translateY(-110vh)
            rotate(360deg);

        opacity: 0;

    }

}


/* Mobile */

@media (max-width: 500px) {

    h1 {
        font-size: 36px;
    }

    .card {
        padding: 25px 18px;
    }

}

</style>

/* =========================================================
   DON'T EDIT BELOW THIS LINE
   ========================================================= */


const startDate = new Date(START_DATE);

const today = new Date();

today.setHours(0,0,0,0);

startDate.setHours(0,0,0,0);


const difference =
    Math.floor(
        (today - startDate) /
        (1000 * 60 * 60 * 24)
    );


const currentDay = difference + 1;


const dayNumber =
    document.getElementById("dayNumber");

const title =
    document.getElementById("title");

const description =
    document.getElementById("description");

const openButton =
    document.getElementById("openButton");

const surprise =
    document.getElementById("surprise");

const message =
    document.getElementById("message");

const photoGallery =
    document.getElementById("photoGallery");

const counter =
    document.getElementById("counter");



function loadDay() {


    /* Before Day 1 */

    if (currentDay < 1) {

        dayNumber.innerText =
            "COMING SOON ❤️";

        title.innerText =
            "Something is waiting for you...";

        description.innerText =
            "Come back when the surprises begin.";

        openButton.style.display =
            "none";

        return;
    }



    /* After all surprises */

    if (currentDay > surprises.length) {

        dayNumber.innerText =
            "THE END ❤️";

        title.innerText =
            "You reached the end.";

        description.innerText =
            "But this isn't the end of us. I have plenty more surprises waiting for you in real life.";

        openButton.style.display =
            "none";

        return;
    }



    const todaySurprise =
        surprises[currentDay - 1];


    dayNumber.innerText =
        "DAY " + currentDay;


    title.innerText =
        todaySurprise.title;


    description.innerText =
        "Your surprise for today is waiting for you.";


    counter.innerText =
        "Day " +
        currentDay +
        " of " +
        surprises.length;

}



function openSurprise() {


    const todaySurprise =
        surprises[currentDay - 1];


    if (!todaySurprise) return;


    /* Show message */

    message.innerText =
        todaySurprise.message;


    /* Clear old images */

    photoGallery.innerHTML = "";


    /* Add today's images */

    todaySurprise.images.forEach(
        function(imagePath) {


            const img =
                document.createElement("img");


            img.src =
                imagePath;


            img.alt =
                "A memory ❤️";


            photoGallery.appendChild(img);

        }
    );


    /* Show surprise */

    surprise.style.display =
        "block";


    openButton.style.display =
        "none";

}



/* =========================================================
   FLOATING HEARTS
   ========================================================= */

function createHeart() {


    const heart =
        document.createElement("div");


    heart.className =
        "heart";


    heart.innerHTML =
        "❤️";


    heart.style.left =
        Math.random() * 100 + "%";


    heart.style.fontSize =
        (12 + Math.random() * 20) + "px";


    heart.style.animationDuration =
        (5 + Math.random() * 5) + "s";


    document
        .querySelector(".hearts")
        .appendChild(heart);


    setTimeout(
        function() {

            heart.remove();

        },
        10000
    );

}


setInterval(createHeart, 900);



/* Start website */

loadDay();

</script>
